<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#efe3bf">
<meta name="description" content="An interactive world atlas of books, mapped by each author’s country.">
<title>The Reader’s World Atlas</title>
<style>
html,body{margin:0;min-height:100%;background:#efe3bf;color:#123f2c;font-family:Georgia,serif}
body{display:grid;place-items:center}.boot{text-align:center;padding:2rem}
.boot b{display:block;font-size:1.4rem;margin-bottom:.6rem}.boot p{opacity:.72}
</style>
</head>
<body>
<main class="boot"><b>Unrolling The Reader’s World Atlas…</b><p>Here be bookwyrms.</p></main>
<script>
fetch('atlas-live.html',{cache:'no-store'}).then(response=>{
  if(!response.ok) throw new Error('Site package unavailable');
  return response.text();
}).then(html=>{
  document.open();
  document.write(html);
  document.close();
}).catch(error=>{
  console.error('[Reader’s World Atlas] Startup failed:',error);
  document.querySelector('.boot').innerHTML='<b>The atlas could not be unrolled.</b><p>Please reload the page.</p>';
});
</script>
</body>
</html>
