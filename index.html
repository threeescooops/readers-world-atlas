<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#e8dab4">
<meta name="description" content="An interactive world atlas of books, mapped by each author's country.">
<title>The Reader’s World Atlas</title>
<style>
html,body{margin:0;min-height:100%;background:#e8dab4;color:#173f2d;font-family:Georgia,serif}
body{display:grid;place-items:center}.boot{text-align:center;padding:2rem}.boot b{display:block;font-size:1.35rem;margin-bottom:.55rem}.boot p{opacity:.72}
</style>
</head>
<body>
<main class="boot"><b>Unrolling The Reader’s World Atlas…</b><p>Here be bookwyrms.</p></main>
<script>
(async()=>{
  try{
    const response=await fetch('atlas.html?v=33e2f524',{cache:'no-store'});
    if(!response.ok)throw new Error(`Atlas source returned ${response.status}`);
    let html=await response.text();
    const fix='<style id="tooltip-flicker-fix">.tooltip{pointer-events:none!important}.tooltip[data-pinned="true"]{pointer-events:auto!important}</style>';
    if(!html.includes('</head>'))throw new Error('Atlas source has no head element');
    html=html.replace('</head>',fix+'</head>');
    document.open();document.write(html);document.close();
  }catch(error){
    console.error('[Reader’s World Atlas] Startup failed:',error);
    document.querySelector('.boot').innerHTML='<b>The atlas could not be unrolled.</b><p>Please reload the page.</p>';
  }
})();
</script>
</body>
</html>
