name: Apply bookwyrm layout tweaks

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-bookwyrm-layout-tweaks.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify and patch the atlas
        shell: bash
        run: |
          set -euo pipefail
          expected_before='5241ddb7c6ade394c9371f60becfa5d5f72b0ec9'
          expected_after='a590a0556480251be966f4b61a7f87356119747e'
          actual_before="$(git hash-object index.html)"

          if [[ "$actual_before" == "$expected_after" ]]; then
            echo 'The layout adjustments are already applied.'
            exit 0
          fi

          if [[ "$actual_before" != "$expected_before" ]]; then
            echo "Unexpected index.html blob: $actual_before"
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '.map-wrap{\n  position:relative;z-index:2;overflow:hidden;isolation:isolate;min-height:520px;margin:0 5px 5px;border:1px solid rgba(93,69,36,.58);border-radius:3px;',
                  '.map-wrap{\n  position:relative;z-index:2;overflow:hidden;isolation:isolate;aspect-ratio:1200 / 650;min-height:0;margin:0 5px 5px;border:1px solid rgba(93,69,36,.58);border-radius:3px;',
              ),
              (
                  '.map{display:block;width:100%;height:auto;min-height:520px;touch-action:none;cursor:grab}',
                  '.map{display:block;width:100%;height:100%;min-height:0;aspect-ratio:1200 / 650;touch-action:none;cursor:grab}',
              ),
              (
                  '.bookwyrm{pointer-events:none;filter:drop-shadow(0 7px 5px rgba(54,37,17,.22))}\n.bookwyrm .banner{fill:rgba(245,232,194,.82);stroke:rgba(96,71,35,.62);stroke-width:1.1}\n.bookwyrm .banner-text{fill:#5d4b2e;font:italic 700 11px Georgia,serif;letter-spacing:.14em}.bookwyrm .serpent-art{opacity:.82;mix-blend-mode:multiply}',
                  '.bookwyrm{pointer-events:none;filter:drop-shadow(0 6px 4px rgba(54,37,17,.2))}\n.bookwyrm .banner-text{fill:#5d4b2e;font:italic 600 8.5px Georgia,serif;letter-spacing:.17em;opacity:.82;paint-order:stroke;stroke:rgba(231,220,183,.88);stroke-width:2.2px;stroke-linejoin:round}\n.bookwyrm .serpent-art{opacity:.8;mix-blend-mode:multiply}',
              ),
              ('  .map-wrap,.map{min-height:470px}', '  .map-wrap,.map{min-height:0}'),
              ('  .map-wrap,.map{min-height:420px}', '  .map-wrap,.map{min-height:0}'),
              (
                  '<svg class="map" id="map" viewBox="0 0 1200 650" role="img" aria-labelledby="svgTitle svgDesc">',
                  '<svg class="map" id="map" viewBox="0 0 1200 650" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="svgTitle svgDesc">',
              ),
              (
                  '        <g class="bookwyrm" transform="translate(485 444)">\n          <path class="banner" d="M54-10c58-12 122-12 180 0l-9 23c-54-8-108-8-162 0Z"></path>\n          <text class="banner-text" x="144" y="5" text-anchor="middle">HERE BE BOOKWYRMS</text>\n          <use class="serpent-art" href="#bookSerpent" x="0" y="6" width="350" height="193"></use>\n        </g>',
                  '        <g class="bookwyrm" transform="translate(510 451)">\n          <use class="serpent-art" href="#bookSerpent" x="0" y="0" width="290" height="160"></use>\n          <text class="banner-text" x="145" y="176" text-anchor="middle">HERE BE BOOKWYRMS</text>\n        </g>',
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected source block was not found: {old[:90]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

          actual_after="$(git hash-object index.html)"
          if [[ "$actual_after" != "$expected_after" ]]; then
            echo "Unexpected patched blob: $actual_after"
            exit 1
          fi

      - name: Commit the update
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Refine bookwyrm label and preserve map proportions'
          git push
