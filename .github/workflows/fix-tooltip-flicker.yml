name: Fix tooltip flicker

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-tooltip-flicker.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Patch hover interaction
        shell: bash
        run: |
          set -euo pipefail
          expected_before='33e2f524c3aacae851afd5cca7a2526f00fb73b5'
          actual_before="$(git hash-object index.html)"

          if [[ "$actual_before" != "$expected_before" ]]; then
            echo "Unexpected index.html blob: $actual_before"
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          if '.tooltip.is-pinned{pointer-events:auto}' in text:
              raise SystemExit('Pinned tooltip CSS already exists unexpectedly.')

          def patch_tooltip_rule(match):
              body = match.group(1)
              if 'pointer-events:' in body:
                  raise SystemExit('The tooltip rule already defines pointer-events unexpectedly.')
              if body and not body.endswith(';'):
                  body += ';'
              body += 'pointer-events:none;'
              return '.tooltip{' + body + '}.tooltip.is-pinned{pointer-events:auto}'

          text, count = re.subn(r'\.tooltip\{([^{}]*)\}', patch_tooltip_rule, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected one tooltip CSS rule, found {count}.')

          old_show = "hoverFeatureId=feature.id;clearHoverClose();state.pinned=pinned;"
          new_show = "hoverFeatureId=feature.id;clearHoverClose();state.pinned=pinned;tooltip.classList.toggle('is-pinned',Boolean(pinned));"
          if text.count(old_show) != 1:
              raise SystemExit(f'Expected one showDetails anchor, found {text.count(old_show)}.')
          text = text.replace(old_show, new_show, 1)

          old_close = "hoverFeatureId=null;clearHoverClose();state.pinned=false;tooltip.hidden=true;"
          new_close = "hoverFeatureId=null;clearHoverClose();state.pinned=false;tooltip.classList.remove('is-pinned');tooltip.hidden=true;"
          if text.count(old_close) != 1:
              raise SystemExit(f'Expected one closeDetails anchor, found {text.count(old_close)}.')
          text = text.replace(old_close, new_close, 1)

          required = (
              '.tooltip.is-pinned{pointer-events:auto}',
              "tooltip.classList.toggle('is-pinned',Boolean(pinned))",
              "tooltip.classList.remove('is-pinned')",
          )
          for marker in required:
              if marker not in text:
                  raise SystemExit(f'Missing expected marker: {marker}')

          path.write_text(text, encoding='utf-8')
          PY

          git diff --check

      - name: Commit the fix
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Prevent hover tooltip flicker'
          git push
